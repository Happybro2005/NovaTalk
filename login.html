<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome Back — NovaTalk</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  
  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            display: ["Space Grotesk", "sans-serif"],
            body: ["Inter", "sans-serif"],
            mono: ["JetBrains Mono", "monospace"],
          },
          colors: {
            bg: '#050816',
            'bg-secondary': '#0F172A',
            primary: '#4F8CFF',
            accent: '#7C3AED',
            success: '#10B981',
            warning: '#F59E0B',
            danger: '#EF4444',
            'text-primary': '#FFFFFF',
            'text-secondary': '#CBD5E1',
          }
        }
      }
    }
  </script>
  
  <!-- Custom styles -->
  <link rel="stylesheet" href="assets/css/main.css">
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-bg text-white font-body selection:bg-primary/35 selection:text-white antialiased">

  <!-- Ambient Backdrop (Quiet variant) -->
  <div class="pointer-events-none fixed inset-0 -z-10 overflow-hidden bg-[#050816]">
    <canvas id="constellation-canvas" data-density="40" class="absolute inset-0 h-full w-full" aria-hidden="true"></canvas>
    <div class="grain absolute inset-0"></div>
  </div>

  <div class="relative flex min-h-screen items-center justify-center px-4 py-12">
    <div class="w-full max-w-md">
      <!-- Logo -->
      <div class="mb-8 flex justify-center">
        <a href="index.html" class="flex items-center gap-2">
          <div class="flex h-12 w-12 items-center justify-center rounded-xl bg-gradient-to-br from-primary to-accent shadow-[0_0_20px_-3px_rgba(79,140,255,0.5)]">
            <i data-lucide="sparkles" class="h-6 w-6 text-white"></i>
          </div>
          <span class="text-2xl font-bold tracking-tight text-white font-display">NovaTalk</span>
        </a>
      </div>

      <!-- Login Glass Card -->
      <div class="glass-strong glow-primary p-8 rounded-2xl">
        <h1 class="text-2xl font-semibold text-white font-display">Welcome back</h1>
        <p class="mt-1.5 text-sm text-[#CBD5E1]">Sign in to pick up where you left orbit.</p>

        <form class="mt-7 space-y-4" onsubmit="event.preventDefault(); window.location.href='dashboard.html';">
          <!-- Email Input -->
          <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-[#CBD5E1]/70 mb-2 font-mono">Email</label>
            <div class="relative flex items-center">
              <span class="absolute left-3.5 text-[#CBD5E1]/50"><i data-lucide="mail" class="h-4 w-4"></i></span>
              <input type="email" required placeholder="you@example.com" class="w-full rounded-lg border border-white/10 bg-white/5 py-2.5 pl-10 pr-4 text-sm text-white placeholder-white/30 outline-none transition-all focus:border-primary focus:bg-white/[0.08] focus:ring-1 focus:ring-primary">
            </div>
          </div>

          <!-- Password Input -->
          <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-[#CBD5E1]/70 mb-2 font-mono">Password</label>
            <div class="relative flex items-center">
              <span class="absolute left-3.5 text-[#CBD5E1]/50"><i data-lucide="lock" class="h-4 w-4"></i></span>
              <input type="password" id="password-field" required placeholder="••••••••" class="w-full rounded-lg border border-white/10 bg-white/5 py-2.5 pl-10 pr-4 text-sm text-white placeholder-white/30 outline-none transition-all focus:border-primary focus:bg-white/[0.08] focus:ring-1 focus:ring-primary">
            </div>
            <button type="button" onclick="togglePasswordVisibility()" class="mt-1.5 flex items-center gap-1.5 text-xs text-[#CBD5E1]/70 hover:text-white">
              <i data-lucide="eye" id="toggle-icon-eye" class="h-3.5 w-3.5"></i>
              <i data-lucide="eye-off" id="toggle-icon-eyeoff" class="h-3.5 w-3.5 hidden"></i>
              <span id="toggle-text">Show password</span>
            </button>
          </div>

          <!-- Checkbox and Forgot -->
          <div class="flex items-center justify-between text-sm">
            <label class="flex items-center gap-2 text-[#CBD5E1] cursor-pointer">
              <input type="checkbox" class="h-4 w-4 rounded border-white/20 bg-white/5 accent-primary">
              Remember me
            </label>
            <a href="forgot-password.html" class="text-primary hover:underline">Forgot password?</a>
          </div>

          <!-- Submit Button -->
          <button type="submit" class="w-full inline-flex items-center justify-center gap-2 rounded-lg text-base font-medium transition-all shadow-[0_4px_20px_-4px_rgba(79,140,255,0.4)] hover:shadow-[0_4px_24px_-2px_rgba(79,140,255,0.6)] active:scale-[0.98] bg-primary text-white hover:bg-[#3d7eff] px-6 py-2.5">
            Sign in
          </button>
        </form>

        <!-- Divider -->
        <div class="my-6 flex items-center gap-3">
          <div class="h-px flex-1 bg-white/10"></div>
          <span class="text-xs text-[#CBD5E1]/60">or continue with</span>
          <div class="h-px flex-1 bg-white/10"></div>
        </div>

        <!-- Google button -->
        <button onclick="window.location.href='dashboard.html';" class="w-full inline-flex items-center justify-center gap-2 rounded-lg text-base font-medium transition-colors border border-white/10 bg-white/5 hover:bg-white/10 active:bg-white/15 px-6 py-2.5 text-white">
          <svg width="18" height="18" viewBox="0 0 18 18" class="mr-1">
            <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.9c1.7-1.57 2.7-3.88 2.7-6.62z" />
            <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.84.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.98v2.33A9 9 0 0 0 9 18z" />
            <path fill="#FBBC05" d="M3.95 10.7A5.4 5.4 0 0 1 3.67 9c0-.59.1-1.17.28-1.7V4.97H.98A9 9 0 0 0 0 9c0 1.45.35 2.83.98 4.03z" />
            <path fill="#EA4335" d="M9 3.58c1.32 0 2.51.46 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .98 4.97L3.95 7.3C4.66 5.17 6.65 3.58 9 3.58z" />
          </svg>
          Continue with Google
        </button>

        <!-- Link to register -->
        <p class="mt-7 text-center text-sm text-[#CBD5E1]">
          New to NovaTalk? 
          <a href="register.html" class="font-medium text-primary hover:underline">Create an account</a>
        </p>
      </div>
    </div>
  </div>

  <script src="assets/js/main.js"></script>
  <script>
    function togglePasswordVisibility() {
      const passwordField = document.getElementById('password-field');
      const eyeIcon = document.getElementById('toggle-icon-eye');
      const eyeOffIcon = document.getElementById('toggle-icon-eyeoff');
      const toggleText = document.getElementById('toggle-text');
      
      if (passwordField.type === 'password') {
        passwordField.type = 'text';
        eyeIcon.classList.add('hidden');
        eyeOffIcon.classList.remove('hidden');
        toggleText.textContent = 'Hide password';
      } else {
        passwordField.type = 'password';
        eyeIcon.classList.remove('hidden');
        eyeOffIcon.classList.add('hidden');
        toggleText.textContent = 'Show password';
      }
    }
  </script>
</body>
</html>
