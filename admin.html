<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Passcode Gate — NovaTalk</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  
  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            display: ["Space Grotesk", "sans-serif"],
            body: ["Inter", "sans-serif"],
            mono: ["JetBrains Mono", "monospace"],
          },
          colors: {
            bg: '#050816',
            'bg-secondary': '#0F172A',
            primary: '#4F8CFF',
            accent: '#7C3AED',
            success: '#10B981',
            warning: '#F59E0B',
            danger: '#EF4444',
            'text-primary': '#FFFFFF',
            'text-secondary': '#CBD5E1',
          }
        }
      }
    }
  </script>
  
  <!-- Custom styles -->
  <link rel="stylesheet" href="assets/css/main.css">
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-bg text-white font-body selection:bg-primary/35 selection:text-white antialiased">

  <!-- Ambient Backdrop (Aurora variant) -->
  <div class="pointer-events-none fixed inset-0 -z-10 overflow-hidden bg-[#050816]">
    <div class="absolute -top-40 left-1/4 h-[520px] w-[520px] rounded-full opacity-40 blur-[120px]" style="background: radial-gradient(circle, #10B981 0%, transparent 70%);"></div>
    <div class="absolute top-1/3 -right-20 h-[460px] w-[460px] rounded-full opacity-30 blur-[130px]" style="background: radial-gradient(circle, #4F8CFF 0%, transparent 70%);"></div>
    <canvas id="constellation-canvas" data-density="40" class="absolute inset-0 h-full w-full" aria-hidden="true"></canvas>
    <div class="grain absolute inset-0"></div>
  </div>

  <div class="relative flex min-h-screen items-center justify-center px-4">
    <div class="glass-strong glow-accent w-full max-w-md rounded-2xl p-8 text-center">
      <!-- Shield Icon -->
      <div class="mx-auto flex h-14 w-14 items-center justify-center rounded-2xl bg-accent/20 text-accent">
        <i data-lucide="shield-alert" class="h-7.5 w-7.5"></i>
      </div>
      
      <p class="eyebrow mt-5">MISSION CONTROL</p>
      <h1 class="mt-2 text-2xl font-semibold text-white font-display">Enter access passcode</h1>
      <p class="mt-2 text-sm text-[#CBD5E1]">
        This console is restricted. Enter the 6-digit operator passcode to continue — no separate admin account needed.
      </p>

      <!-- Keypad Inputs -->
      <div class="mt-7 flex justify-center gap-2.5">
        <input type="text" inputmode="numeric" maxlength="1" class="pin-input h-14 w-11 rounded-xl border border-white/10 bg-white/[0.05] text-center text-xl font-semibold text-white outline-none transition-all focus:border-accent/60 focus:ring-2 focus:ring-accent/40">
        <input type="text" inputmode="numeric" maxlength="1" class="pin-input h-14 w-11 rounded-xl border border-white/10 bg-white/[0.05] text-center text-xl font-semibold text-white outline-none transition-all focus:border-accent/60 focus:ring-2 focus:ring-accent/40">
        <input type="text" inputmode="numeric" maxlength="1" class="pin-input h-14 w-11 rounded-xl border border-white/10 bg-white/[0.05] text-center text-xl font-semibold text-white outline-none transition-all focus:border-accent/60 focus:ring-2 focus:ring-accent/40">
        <input type="text" inputmode="numeric" maxlength="1" class="pin-input h-14 w-11 rounded-xl border border-white/10 bg-white/[0.05] text-center text-xl font-semibold text-white outline-none transition-all focus:border-accent/60 focus:ring-2 focus:ring-accent/40">
        <input type="text" inputmode="numeric" maxlength="1" class="pin-input h-14 w-11 rounded-xl border border-white/10 bg-white/[0.05] text-center text-xl font-semibold text-white outline-none transition-all focus:border-accent/60 focus:ring-2 focus:ring-accent/40">
        <input type="text" inputmode="numeric" maxlength="1" class="pin-input h-14 w-11 rounded-xl border border-white/10 bg-white/[0.05] text-center text-xl font-semibold text-white outline-none transition-all focus:border-accent/60 focus:ring-2 focus:ring-accent/40">
      </div>

      <!-- Error Message -->
      <p id="error-message" class="mt-3 text-xs text-danger hidden">Enter all 6 digits to continue.</p>

      <!-- Submit -->
      <button onclick="submitPasscode()" class="mt-7 w-full inline-flex items-center justify-center gap-2 rounded-lg text-base font-medium transition-all shadow-[0_4px_20px_-4px_rgba(124,58,237,0.4)] hover:shadow-[0_4px_24px_-2px_rgba(124,58,237,0.6)] active:scale-[0.98] bg-accent text-white hover:bg-[#6c2ee0] px-6 py-3">
        <i data-lucide="key-round" class="h-4.5 w-4.5 mr-1"></i> Unlock console
      </button>

      <p class="mt-5 text-xs text-[#CBD5E1]/50">
        Passcodes are rotated by the operations lead. Contact your team lead if yours has expired.
      </p>
    </div>
  </div>

  <script src="assets/js/main.js"></script>
  <script>
    const inputs = document.querySelectorAll('.pin-input');
    const errorMessage = document.getElementById('error-message');

    inputs.forEach((input, index) => {
      // Auto focus next input
      input.addEventListener('input', (e) => {
        const val = e.target.value;
        // Keep only numbers
        e.target.value = val.replace(/\D/g, '');
        errorMessage.classList.add('hidden');
        inputs.forEach(el => el.classList.remove('border-danger/60'));

        if (e.target.value.length === 1 && index < inputs.length - 1) {
          inputs[index + 1].focus();
        }
      });

      // Handle Backspace back focus
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && !e.target.value && index > 0) {
          inputs[index - 1].focus();
        }
      });

      // Handle paste
      input.addEventListener('paste', (e) => {
        e.preventDefault();
        const pasted = e.clipboardData.getData('text').replace(/\D/g, '').slice(0, 6);
        pasted.split('').forEach((char, i) => {
          if (inputs[i]) {
            inputs[i].value = char;
          }
        });
        const targetFocus = Math.min(pasted.length, inputs.length - 1);
        inputs[targetFocus].focus();
      });
    });

    function submitPasscode() {
      const code = Array.from(inputs).map(i => i.value).join('');
      if (code.length === 6) {
        window.location.href = 'admin-dashboard.html';
      } else {
        errorMessage.classList.remove('hidden');
        inputs.forEach(el => el.classList.add('border-danger/60'));
      }
    }
  </script>
</body>
</html>
