<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Friend Requests — NovaTalk</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { fontFamily: { display: ["Space Grotesk", "sans-serif"], body: ["Inter", "sans-serif"], mono: ["JetBrains Mono", "monospace"] }, colors: { bg: '#050816', 'bg-secondary': '#0F172A', primary: '#4F8CFF', accent: '#7C3AED', success: '#10B981', warning: '#F59E0B', danger: '#EF4444', 'text-primary': '#FFFFFF', 'text-secondary': '#CBD5E1' } } } }
  </script>
  <link rel="stylesheet" href="assets/css/main.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-bg text-white font-body selection:bg-primary/35 selection:text-white antialiased">
  <div class="pointer-events-none fixed inset-0 -z-10 overflow-hidden bg-[#050816]">
    <canvas id="constellation-canvas" data-density="35" class="absolute inset-0 h-full w-full" aria-hidden="true"></canvas>
    <div class="grain absolute inset-0"></div>
  </div>

  <div class="relative min-h-screen">
    <aside class="sticky top-0 hidden h-screen w-64 shrink-0 flex-col border-r border-white/[0.06] bg-[#050816]/60 backdrop-blur-xl lg:flex">
      <div class="px-6 py-6">
        <a href="index.html" class="flex items-center gap-2">
          <div class="flex h-9 w-9 items-center justify-center rounded-xl bg-gradient-to-br from-primary to-accent">
            <i data-lucide="sparkles" class="h-5 w-5 text-white"></i>
          </div>
          <span class="text-xl font-bold tracking-tight text-white font-display">NovaTalk</span>
        </a>
      </div>
      <nav class="flex-1 space-y-1 px-3">
        <a href="dashboard.html" class="flex items-center gap-3 rounded-xl px-3.5 py-2.5 text-sm font-medium text-[#CBD5E1] hover:bg-white/[0.05] hover:text-white transition-all"><i data-lucide="layout-dashboard" class="h-[18px] w-[18px]"></i> Dashboard</a>
        <a href="stranger-chat.html" class="flex items-center gap-3 rounded-xl px-3.5 py-2.5 text-sm font-medium text-[#CBD5E1] hover:bg-white/[0.05] hover:text-white transition-all"><i data-lucide="message-circle" class="h-[18px] w-[18px]"></i> Stranger Chat</a>
        <a href="friends.html" class="flex items-center gap-3 rounded-xl px-3.5 py-2.5 text-sm font-medium text-[#CBD5E1] hover:bg-white/[0.05] hover:text-white transition-all"><i data-lucide="users" class="h-[18px] w-[18px]"></i> Friends</a>
        <a href="friend-requests.html" class="flex items-center gap-3 rounded-xl px-3.5 py-2.5 text-sm font-medium transition-all glass text-white glow-primary"><i data-lucide="user-plus" class="h-[18px] w-[18px]"></i> Requests</a>
        <a href="communities.html" class="flex items-center gap-3 rounded-xl px-3.5 py-2.5 text-sm font-medium text-[#CBD5E1] hover:bg-white/[0.05] hover:text-white transition-all"><i data-lucide="compass" class="h-[18px] w-[18px]"></i> Communities</a>
        <a href="notifications.html" class="flex items-center gap-3 rounded-xl px-3.5 py-2.5 text-sm font-medium text-[#CBD5E1] hover:bg-white/[0.05] hover:text-white transition-all"><i data-lucide="bell" class="h-[18px] w-[18px]"></i> Notifications</a>
        <a href="settings.html" class="flex items-center gap-3 rounded-xl px-3.5 py-2.5 text-sm font-medium text-[#CBD5E1] hover:bg-white/[0.05] hover:text-white transition-all"><i data-lucide="settings" class="h-[18px] w-[18px]"></i> Settings</a>
        <a href="support.html" class="flex items-center gap-3 rounded-xl px-3.5 py-2.5 text-sm font-medium text-[#CBD5E1] hover:bg-white/[0.05] hover:text-white transition-all"><i data-lucide="life-buoy" class="h-[18px] w-[18px]"></i> Support</a>
      </nav>
    </aside>

    <div id="mobile-sidebar" class="fixed inset-0 z-50 hidden lg:hidden">
      <div class="absolute inset-0 bg-black/60" onclick="toggleMobileSidebar()"></div>
      <aside class="glass-strong absolute left-0 top-0 flex h-full w-72 flex-col p-4">
        <div class="mb-6 flex items-center justify-between px-2 py-2">
          <a href="index.html" class="flex items-center gap-2">
            <div class="flex h-9 w-9 items-center justify-center rounded-xl bg-gradient-to-br from-primary to-accent shadow-[0_0_20px_-3px_rgba(79,140,255,0.5)]">
              <i data-lucide="sparkles" class="h-5 w-5 text-white"></i>
            </div>
            <span class="text-xl font-bold tracking-tight text-white font-display">NovaTalk</span>
          </a>
          <button onclick="toggleMobileSidebar()" class="text-[#CBD5E1]">
            <i data-lucide="x" class="h-5 w-5"></i>
          </button>
        </div>
        <nav class="space-y-1">
          <a href="dashboard.html" onclick="toggleMobileSidebar()" class="flex items-center gap-3 rounded-xl px-3.5 py-2.5 text-sm font-medium text-[#CBD5E1] hover:bg-white/[0.06]"><i data-lucide="layout-dashboard" class="h-[18px] w-[18px]"></i> Dashboard</a>
          <a href="stranger-chat.html" onclick="toggleMobileSidebar()" class="flex items-center gap-3 rounded-xl px-3.5 py-2.5 text-sm font-medium text-[#CBD5E1] hover:bg-white/[0.06]"><i data-lucide="message-circle" class="h-[18px] w-[18px]"></i> Stranger Chat</a>
          <a href="friends.html" onclick="toggleMobileSidebar()" class="flex items-center gap-3 rounded-xl px-3.5 py-2.5 text-sm font-medium text-[#CBD5E1] hover:bg-white/[0.06]"><i data-lucide="users" class="h-[18px] w-[18px]"></i> Friends</a>
          <a href="friend-requests.html" onclick="toggleMobileSidebar()" class="flex items-center gap-3 rounded-xl bg-white/[0.06] px-3.5 py-2.5 text-sm font-medium text-white"><i data-lucide="user-plus" class="h-[18px] w-[18px]"></i> Requests</a>
          <a href="communities.html" onclick="toggleMobileSidebar()" class="flex items-center gap-3 rounded-xl px-3.5 py-2.5 text-sm font-medium text-[#CBD5E1] hover:bg-white/[0.06]"><i data-lucide="compass" class="h-[18px] w-[18px]"></i> Communities</a>
          <a href="notifications.html" onclick="toggleMobileSidebar()" class="flex items-center gap-3 rounded-xl px-3.5 py-2.5 text-sm font-medium text-[#CBD5E1] hover:bg-white/[0.06]"><i data-lucide="bell" class="h-[18px] w-[18px]"></i> Notifications</a>
          <a href="settings.html" onclick="toggleMobileSidebar()" class="flex items-center gap-3 rounded-xl px-3.5 py-2.5 text-sm font-medium text-[#CBD5E1] hover:bg-white/[0.06]"><i data-lucide="settings" class="h-[18px] w-[18px]"></i> Settings</a>
          <a href="support.html" onclick="toggleMobileSidebar()" class="flex items-center gap-3 rounded-xl px-3.5 py-2.5 text-sm font-medium text-[#CBD5E1] hover:bg-white/[0.06]"><i data-lucide="life-buoy" class="h-[18px] w-[18px]"></i> Support</a>
        </nav>
      </aside>
    </div>

    <div class="min-h-screen flex-1 px-4 pb-16 pt-6 sm:px-6">
      <header class="mb-6 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <button onclick="toggleMobileSidebar()" class="text-[#CBD5E1] lg:hidden">
            <i data-lucide="menu" class="h-[22px] w-[22px]"></i>
          </button>
          <div>
            <div class="eyebrow">REQUESTS</div>
            <h1 class="mt-1 text-3xl font-semibold tracking-tight text-white font-display">Friend requests</h1>
          </div>
        </div>
        <button id="refreshRequests" class="rounded-xl border border-white/10 bg-white/[0.04] px-4 py-2 text-sm text-white hover:bg-white/[0.08]">Refresh</button>
      </header>

      <main class="grid gap-6 lg:grid-cols-2">
        <section class="glass rounded-2xl p-6">
          <h2 class="text-xl font-semibold text-white font-display">Incoming</h2>
          <div id="incomingRequests" class="mt-4 space-y-4"></div>
        </section>

        <section class="glass rounded-2xl p-6">
          <h2 class="text-xl font-semibold text-white font-display">Outgoing</h2>
          <div id="outgoingRequests" class="mt-4 space-y-4"></div>
        </section>
      </main>
    </div>
  </div>

  <script src="assets/js/main.js"></script>
  <script>
    function toggleMobileSidebar() {
      const sidebar = document.getElementById('mobile-sidebar')
      if (sidebar) sidebar.classList.toggle('hidden')
    }

    const incomingRequests = document.getElementById('incomingRequests')
    const outgoingRequests = document.getElementById('outgoingRequests')
    const refreshRequests = document.getElementById('refreshRequests')

    async function loadRequests() {
      try {
        const response = await fetch('/api/friends/requests/u1')
        const data = await response.json()
        const incoming = data.incoming || []
        const outgoing = data.outgoing || []

        incomingRequests.innerHTML = incoming.length
          ? incoming.map((request) => `
            <div class="rounded-xl border border-white/10 bg-white/[0.03] p-4">
              <div class="flex items-center justify-between gap-3">
                <div>
                  <div class="font-medium text-white">Request from ${request.from}</div>
                  <div class="mt-1 text-xs text-[#CBD5E1]/70">${new Date(request.createdAt).toLocaleString()}</div>
                </div>
                <div class="flex gap-2">
                  <button data-action="accept" data-id="${request.id}" class="request-btn rounded-lg bg-success/20 px-3 py-1.5 text-xs font-medium text-[#10B981] hover:bg-success/25">Accept</button>
                  <button data-action="reject" data-id="${request.id}" class="request-btn rounded-lg bg-danger/15 px-3 py-1.5 text-xs font-medium text-[#EF4444] hover:bg-danger/20">Reject</button>
                </div>
              </div>
            </div>
          `).join('')
          : '<div class="rounded-xl border border-dashed border-white/10 p-5 text-sm text-[#CBD5E1]">No incoming requests.</div>'

        outgoingRequests.innerHTML = outgoing.length
          ? outgoing.map((request) => `
            <div class="rounded-xl border border-white/10 bg-white/[0.03] p-4">
              <div class="font-medium text-white">To ${request.to}</div>
              <div class="mt-1 text-xs text-[#CBD5E1]/70">Pending • ${new Date(request.createdAt).toLocaleString()}</div>
            </div>
          `).join('')
          : '<div class="rounded-xl border border-dashed border-white/10 p-5 text-sm text-[#CBD5E1]">No outgoing requests.</div>'

        document.querySelectorAll('.request-btn').forEach((button) => {
          button.addEventListener('click', async () => {
            const requestId = button.dataset.id
            const action = button.dataset.action

            try {
              await fetch('/api/friends/respond', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ requestId, action, userId: 'u1' })
              })
              loadRequests()
            } catch (error) {
              console.error(error)
            }
          })
        })
      } catch (error) {
        incomingRequests.innerHTML = '<div class="rounded-xl border border-red-500/30 bg-red-500/10 p-4 text-sm text-red-200">Unable to load requests.</div>'
        outgoingRequests.innerHTML = ''
        console.error(error)
      }
    }

    refreshRequests.addEventListener('click', loadRequests)
    loadRequests()
  </script>
</body>
</html>
